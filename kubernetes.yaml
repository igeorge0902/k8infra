---
# ================================================
# dalogin-quarkus Deployment + Service
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dalogin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dalogin
  template:
    metadata:
      labels:
        app: dalogin
    spec:
      containers:
        - name: dalogin
          image: dalogin-quarkus:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: WILDFLY_URL
              value: http://apache
            - name: QUARKUS_DATASOURCE_DB_KIND
              value: mysql
            - name: QUARKUS_DATASOURCE_USERNAME
              value: sqluser
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: sqluserpw
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:mysql://mysql:3306/login_
---
apiVersion: v1
kind: Service
metadata:
  name: dalogin
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: dalogin

---
# ================================================
# Apache HTTPD Deployment + Service
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
spec:
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache
          image: httpd:2.4-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              sed -i 's/^#LoadModule proxy_module /LoadModule proxy_module /' /usr/local/apache2/conf/httpd.conf
              sed -i 's/^#LoadModule proxy_http_module /LoadModule proxy_http_module /' /usr/local/apache2/conf/httpd.conf
              sed -i 's/^#LoadModule proxy_wstunnel_module /LoadModule proxy_wstunnel_module /' /usr/local/apache2/conf/httpd.conf
              printf '\nInclude conf/extra/proxy.conf\n' >> /usr/local/apache2/conf/httpd.conf
              httpd-foreground
          ports:
            - containerPort: 80
          volumeMounts:
            - name: apache-config
              mountPath: /usr/local/apache2/conf/extra/proxy.conf
              subPath: proxy.conf
      volumes:
        - name: apache-config
          configMap:
            name: apache-config

---
apiVersion: v1
kind: Service
metadata:
  name: apache
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: apache

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apache-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: milo.crabdance.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apache
                port:
                  number: 80

