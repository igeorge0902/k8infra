# ================================================
# MySQL bootstrap ConfigMap
# ================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  00-init.sql: |
    CREATE DATABASE IF NOT EXISTS login_;
    CREATE DATABASE IF NOT EXISTS book;
    CREATE USER IF NOT EXISTS 'sqluser'@'%' IDENTIFIED BY 'sqluserpw';
    GRANT ALL PRIVILEGES ON login_.* TO 'sqluser'@'%';
    GRANT ALL PRIVILEGES ON book.* TO 'sqluser'@'%';
    FLUSH PRIVILEGES;
---
# ================================================
# MySQL Deployment + Service
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpw
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-init-volume
              mountPath: /docker-entrypoint-initdb.d
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-init-volume
          configMap:
            name: mysql-init
        - name: mysql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql

---
# ================================================
# Zookeeper Deployment + Service
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.9
          ports:
            - containerPort: 2181
          env:
            - name: ZOO_STANDALONE_ENABLED
              value: "true"
            - name: ZOO_ADMINSERVER_ENABLED
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  ports:
    - port: 2181
      targetPort: 2181
  selector:
    app: zookeeper

---
# ================================================
# Kafka Deployment + Service
# ================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  server.properties: |
    broker.id=1
    listeners=PLAINTEXT://:9092
    advertised.listeners=PLAINTEXT://kafka:9092
    log.dirs=/var/lib/kafka/data
    zookeeper.connect=zookeeper:2181
    num.partitions=3
    offsets.topic.replication.factor=1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
          command: ["/bin/sh", "-c"]
          args:
            - exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/server.properties
          volumeMounts:
            - name: kafka-config
              mountPath: /opt/kafka/config/server.properties
              subPath: server.properties
      volumes:
        - name: kafka-config
          configMap:
            name: kafka-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: kafka

---
# ================================================
# Apache HTTPD reverse proxy config
# ================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-config
data:
  proxy.conf: |
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /login http://dalogin:8080/login retry=0
    ProxyPassReverse /login http://dalogin:8080/login

    ProxyPass /mbook-1 http://mbook:8888/mbook-1 retry=0
    ProxyPassReverse /mbook-1 http://mbook:8888/mbook-1

    ProxyPass /mbooks-1 http://mbooks:8080/mbooks-1 retry=0
    ProxyPassReverse /mbooks-1 http://mbooks:8080/mbooks-1

    ProxyPass /mbook-1/ws ws://mbook:8888/mbook-1/ws
    ProxyPassReverse /mbook-1/ws ws://mbook:8888/mbook-1/ws

    ProxyPass /mbooks-1/ws ws://mbooks:8080/mbooks-1/ws
    ProxyPassReverse /mbooks-1/ws ws://mbooks:8080/mbooks-1/ws

---
# ================================================
# mbook-quarkus Deployment + Service
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mbook
  template:
    metadata:
      labels:
        app: mbook
    spec:
      containers:
        - name: mbook
          image: mbook-quarkus:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8888"
            - name: QUARKUS_DATASOURCE_DB_KIND
              value: mysql
            - name: QUARKUS_DATASOURCE_USERNAME
              value: sqluser
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: sqluserpw
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:mysql://mysql:3306/login_
            - name: BOOTSTRAP_URL
              value: kafka:9092
            - name: QUARKUS_OTEL_ENABLED
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: mbook
spec:
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: mbook

---
